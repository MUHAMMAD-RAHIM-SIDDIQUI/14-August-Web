</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark custom-navbar fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold gradient-text" href="index.html"><img src="assests/images/logo.png" height="60px" width="100px "></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav6">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="nav6" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto fw-semibold gap-2">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="symbols.html">National Symbols</a></li>
          <li class="nav-item"><a class="nav-link" href="anthem.html">Anthem</a></li>
          <li class="nav-item"><a class="nav-link" href="history.html">History</a></li>

          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <header class="hero d-flex align-items-center text-center text-white">
    <div class="container">
      <h1 class="display-4 fw-bold gradient-text stylish-heading">Get in Touch</h1>
      <p class="lead animate-slide">Send your patriotic wishes or collaboration ideas</p>
    </div>
  </header>

  <!-- Contact Section -->
  <main class="py-5 contact-section">
    <div class="container">
      <div class="row g-4 align-items-stretch">

        <!-- Form -->
        <div class="col-lg-7">
          <div class="custom-card h-100 p-4" data-aos="fade-down" data-aos-duration="2000">
            <h3 class="gradient-text mb-4">Send a Message</h3>
            <form class="contact-form">
              <div class="mb-3">
                <label class="form-label text-light">Name</label>
                <input type="text" class="form-control" placeholder="Your name">
              </div>
              <div class="mb-3">
                <label class="form-label text-light">Email</label>
                <input type="email" class="form-control" placeholder="you@example.com">
              </div>
              <div class="mb-3">
                <label class="form-label text-light">Message</label>
                <textarea class="form-control" rows="5" placeholder="Type your message..."></textarea>
              </div>
              <button class="btn btn-gold px-4" type="button">Send Message</button>
            </form>
          </div>
        </div>

        <!-- Map -->
        <div class="col-lg-5">
          <div class="custom-card h-100 p-4" data-aos="fade-up" data-aos-duration="2000">
            <h3 class="gradient-text mb-4">Find Pakistan</h3>
            <div class="map-wrap rounded overflow-hidden">
              <iframe src="https://www.google.com/maps?q=Pakistan&output=embed" width="100%" height="350" style="border:0"></iframe>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer text-white text-center py-3">
    <p class="mb-0">© 2025 • 14 August Website | Designed by <b>M Rahim</b></p>
  </footer>

</body>
